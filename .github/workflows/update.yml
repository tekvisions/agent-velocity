name: Update Agent Velocity
on:
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
# Commit uses default GITHUB_TOKEN (no workflow retrigger). Do not add a push: trigger.
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: agent-velocity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Recompute from GitHub signals
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: python build_data.py
      - name: Render public share card
        run: |
          python -m venv .og-venv
          .og-venv/bin/pip install --quiet Pillow==11.3.0
          .og-venv/bin/python gen_og.py
          .og-venv/bin/python -m unittest discover -s tests -p test_og_content.py
          python -m unittest discover -s tests -p test_deploy_private_assets.py

      - name: Commit data if changed
        run: |
          git config user.name "agent-velocity-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data.json og.png og-20261030.png; then
            git add data.json og.png og-20261030.png && git commit -m "data: daily velocity refresh ($(date -u +%Y-%m-%d))" && git push
          else echo "No data change."; fi
      - name: Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: python deploy.py
      - name: Ping IndexNow
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: python indexnow_ping.py
